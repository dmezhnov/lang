version: 0.1
cli:
    version: 1.25.0

plugins:
    sources:
        - id: trunk
          ref: v1.7.4
          uri: https://github.com/trunk-io/plugins

runtimes:
    enabled:
        - node@22.16.0
        - python@3.10.8

lint:
    enabled:
        - renovate@42.86.1
        - taplo@0.10.0
        - eslint@9.39.1
        - git-diff-check
        - markdownlint@0.46.0
    ignore:
        - linters: [ALL]
          paths:
              - out/**
              - release/**
              - src/language/generated/**
        - linters: [markdownlint]
          paths:
              - vscode-extension/CHANGELOG.md
              - vscode-extension/README.md
              - CHANGELOG.md
              - README.md
              - zed-extension/README.md
              - release/**
