version: 0.1
cli:
    version: 1.25.0

plugins:
    sources:
        - id: trunk
          ref: v1.7.4
          uri: https://github.com/trunk-io/plugins

runtimes:
    enabled:
        - node@22.16.0
        - python@3.10.8

lint:
    enabled:
        - taplo@0.10.0
        - eslint@9.39.1
        - git-diff-check
        - markdownlint@0.46.0
        # Security linters that require hermetic Python are disabled by default
        # because they fail on NixOS due to missing libcrypt.so.1 in the system.
        # They can be re-enabled in environments where hermetic runtimes work.
        # - yamllint@1.37.1
        # - checkov@3.2.494
        # - osv-scanner@2.3.0
        # - trufflehog@3.91.1
