[tasks.build]
run = "mise bun-run run scripts/generate-lang.bun.ts && mise bun-run x vsce package"

[tasks.test]
run = "mise sh-run run build && mise bun-run test"

[tasks.publish]
run = "mise sh-run run test && mise bun-run x vsce publish"

[tasks.lint]
run = "mise trunk check --show-existing"

[tasks.format]
run = "mise trunk fmt"

[tasks.save]
run = "mise bun-run run scripts/save.bun.ts"

[tasks.trunk]
run = '''
    {%- if env.IS_TRUNK_INSTALLED == "true" -%}
        mise sh-run trunk
    {%- else -%}
        mise bun-run trunk
    {%- endif -%}
'''

[tasks.install]
run = "mise sh-run install"

[tasks.preinstall]
run = ""

[tasks.postinstall]
run = "mise bun-run i && mise build && mise trunk install"

[tasks.sh-run]
run = '''
    mise trusted --all
    {%- if env.IS_NIX_OS == "true" -%}
        nix develop -c mise run
    {%- else -%}
        mise run
    {%- endif -%}
'''

[tasks.bun-run]
run = "mise sh-run x bun -- bun"

[settings]
windows_shim_mode = "symlink"
yes = true
experimental = true
auto_install = true
exec_auto_install = true
not_found_auto_install = true
task_run_auto_install = true
lockfile = true
all_compile = false

[settings.npm]
bun = true

[settings.status]
missing_tools = "always"

[hooks]
preinstall = "mise bun-run run scripts/preinstall.bun.ts"
postinstall = "mise bun-run run scripts/postinstall.bun.ts"

[env]
IS_NIX_OS = '''{%- set os = os() -%}
{%- set nix_folder = '/etc/os-release' -%}

{%- if os is matching("linux") -%}
{%- set is_linux = true -%}
{%- else -%}
{%- set is_linux = false -%}
{%- endif -%}

{%- if nix_folder is exists -%}
{%- set is_nix_folder_exists = true -%}
{%- else -%}
{%- set is_nix_folder_exists = false -%}
{%- endif -%}

{%- if is_linux and is_nix_folder_exists -%}
{%- set is_nix_os = true -%}
{%- else -%}
{%- set is_nix_os = false -%}
{%- endif -%}

{{- is_nix_os -}}'''

IS_TRUNK_INSTALLED = '''{%- set os_name = os() | lower -%}
{%- if os_name is matching("windows") -%}
{%- set path_sep = ';' -%}
{%- set exe_candidates = ['trunk.exe', 'trunk.bat', 'trunk.cmd'] -%}
{%- else -%}
{%- set path_sep = ':' -%}
{%- set exe_candidates = ['trunk'] -%}
{%- endif -%}

{%- if env.PATH is defined -%}
{%- set raw_path = env.PATH | default(value="") -%}
{%- elif env.Path is defined -%}
{%- set raw_path = env.Path | default(value="") -%}
{%- else -%}
{%- set raw_path = "" -%}
{%- endif -%}

{%- set path_dirs = raw_path | split(pat=path_sep) -%}
{%- set_global existing = [] -%}
{%- for dir in path_dirs -%}
    {%- if dir | length > 0 -%}
        {%- for exe in exe_candidates -%}
            {%- set candidate = [dir, exe] | join_path -%}
            {%- if candidate is file -%}
                {%- set_global existing = existing | concat(with=[candidate]) -%}
            {%- endif -%}
        {%- endfor -%}
    {%- endif -%}
{%- endfor -%}

{{- (existing | length > 0) -}}'''
