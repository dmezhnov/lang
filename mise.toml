[tasks.build]
run = [
  "mise sh-run bun run build",
  "mise sh-run bun run scripts/package.bun.ts",
]

[tasks.test]
run = ["mise sh-run mise run build", "mise sh-run bun test"]

[tasks.publish]
run = [
  "mise sh-run bun run scripts/publish.bun.ts",
  "mise sh-run bun x vsce publish",
  "mise sh-run bun x ovsx publish",
]

[tasks.lint]
run = [
  # Run trunk inside the effective environment (flake devShell on NixOS, or
  # the current environment elsewhere). Within that environment, prefer a
  # real `trunk` on PATH and only fall back to `bun x trunk` if it is missing.
  "mise sh-run bun run scripts/trunk.bun.ts -- check --show-existing",
]

[tasks.format]
run = [
  # Same strategy as in [tasks.lint]: choose the effective environment first
  # (flake devShell on NixOS, current env elsewhere), then prefer `trunk`
  # from PATH and only fall back to `bun x trunk` if necessary.
  "mise sh-run bun run scripts/trunk.bun.ts -- fmt",
]

[tasks.save]
run = ["mise sh-run bun run scripts/save.bun.ts"]

[tasks.install]
run = ["mise sh-run mise install"]

[tasks.preinstall]
run = ["mise sh-run bun run scripts/preinstall.bun.ts"]

[tasks.postinstall]
run = [
  # Ensure JS dependencies and build artifacts are up to date.
  "mise sh-run bun install",
  "mise build",
  # Make sure Trunk and its linters are installed.
  # As with lint/format, decide inside the effective environment:
  # use `trunk` from PATH when available, otherwise fall back to `bun x trunk`.
  "mise sh-run bun run scripts/trunk.bun.ts -- install",
]

[tasks.sh-run]
run = '''
    {%- set is_nix_os = env.IS_NIX_OS | default(value="false") -%}
    {%- set in_nix_shell = env.IN_NIX_SHELL | default(value="") -%}

    {%- if is_nix_os == "true" and in_nix_shell | length == 0 -%}
        nix develop -c
    {%- endif -%}
'''

[settings]
windows_shim_mode = "symlink"
yes = true
experimental = true
auto_install = true
exec_auto_install = true
not_found_auto_install = true
task_run_auto_install = true
lockfile = true
all_compile = false

[settings.status]
missing_tools = "always"

[hooks]
preinstall = "mise sh-run bun run scripts/preinstall.bun.ts"
postinstall = "mise sh-run bun run scripts/postinstall.bun.ts"

[env]
IS_NIX_OS = '''
    {%- set os_name = os() | lower -%}
    {%- set nix_marker_legacy = '/etc/NIXOS' -%}

    {%- if os_name is matching("linux") and (nix_marker_legacy is exists or env.__NIXOS_SET_ENVIRONMENT_DONE is defined) -%}
        true
    {%- else -%}
        false
    {%- endif -%}
'''

IS_TRUNK_INSTALLED = '''
    {%- set os_name = os() | lower -%}

    {%- if os_name is matching("windows") -%}
        {%- set path_sep = ';' -%}
        {%- set exe_candidates = ['trunk.exe', 'trunk.bat', 'trunk.cmd'] -%}
    {%- else -%}
        {%- set path_sep = ':' -%}
        {%- set exe_candidates = ['trunk'] -%}
    {%- endif -%}

    {%- if env.PATH is defined -%}
        {%- set raw_path = env.PATH | default(value="") -%}
    {%- elif env.Path is defined -%}
        {%- set raw_path = env.Path | default(value="") -%}
    {%- else -%}
        {%- set raw_path = "" -%}
    {%- endif -%}

    {%- set path_dirs = raw_path | split(pat=path_sep) -%}
    {%- set_global existing = [] -%}

    {%- for dir in path_dirs -%}
        {%- if dir | length > 0 -%}
            {%- for exe in exe_candidates -%}
                {%- set candidate = [dir, exe] | join_path -%}
                {%- if candidate is file -%}
                    {%- set_global existing = existing | concat(with=[candidate]) -%}
                {%- endif -%}
            {%- endfor -%}
        {%- endif -%}
    {%- endfor -%}

    {{- (existing | length > 0) -}}
'''
