[tasks.build]
run = "mise sh-run mise x bun -- bun run scripts/generate-lang.bun.ts && mise x bun -- bun x vsce package"

[tasks.test]
run = "mise sh-run mise run build && mise x bun -- bun test"

[tasks.publish]
run = "mise sh-run mise run test && mise x bun -- bun x vsce publish"

[tasks.lint]
run = "mise trunk check --show-existing"

[tasks.format]
run = "mise trunk fmt"

[tasks.save]
run = "mise sh-run mise x bun -- bun run scripts/save.bun.ts"

[tasks.trunk-install]
run = "mise trunk install"

[tasks.trunk]
run = ""

[tasks.install]
run = "mise sh-run mise install"

[tasks.preinstall]
run = ""

[tasks.postinstall]
run = "mise sh-run mise x bun -- bun i && mise build && mise run trunk-install"


[tasks.sh-run]
run = "mise x bun -- bun run scripts/devshell-run.bun.ts"

[settings]
windows_shim_mode = "symlink"
yes = true
experimental = true
auto_install = true
exec_auto_install = true
not_found_auto_install = true
task_run_auto_install = true
lockfile = true
all_compile = false

[settings.npm]
bun = true

[settings.status]
missing_tools = "always"

[hooks]
preinstall = "mise x bun -- bun run scripts/preinstall.bun.ts"
postinstall = "mise x bun -- bun run scripts/postinstall.bun.ts"

[env]
IS_NIX_OS = '''
    {% set os = os() %}
    {% set nix_folder = '/etc/os-release' %}
    {% set is_nix_folder_exists = false %}
    {% set is_linux = false %}

    {% if os is matching("linux") %}
        {% set is_linux = true %}
    {% else %}
        {% set is_linux = false %}
    {% endif %}

    {% if nix_folder is exists %}
        {% set is_nix_folder_exists = true %}
    {% else %}
        {% set is_nix_folder_exists = false %}
    {% endif %}

    {% if is_linux and is_nix_folder_exists %}
        {% set is_nix_os = true %}
    {% else %}
        {% set is_nix_os = false %}
    {% endif %}

    {{ is_nix_os }}
'''
