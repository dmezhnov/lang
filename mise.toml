[settings]
windows_shim_mode = "symlink"
yes = true
experimental = true

[settings.npm]
bun = true

[settings.status]
missing_tools = "always"

[hooks]
postinstall = "mise x bun -- bun i && mise build && mise x bun -- bun trunk install"

[tasks.build]
run = "mise x bun -- bun generate-lang.bun.ts && mise x bun -- bun x vsce package"

[tasks.test]
run = "mise build && mise x bun -- bun test"

[tasks.publish]
run = "mise test && mise x bun -- bun x vsce publish"

[tasks.lint]
run = "mise x bun -- bun trunk check --show-existing"

[tasks.format]
run = "mise x bun -- bun trunk fmt"

[tasks.save]
run = '''
    mise x bun -- bun run scripts/save.bun.ts
'''

[tasks.install]
run = "mise install"
